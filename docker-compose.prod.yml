services:
  zyrax:
    build: .
    container_name: zyrax_bot
    depends_on:
      - mongo
      - redis
    env_file:
      - .env
    volumes:
      - ./zyrax:/app/zyrax
      - ./logs:/app/logs
    ports:
      - "127.0.0.1:8080:8080"
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - zyrax_net

  mongo:
    image: mongo:latest
    container_name: zyrax_mongo
    volumes:
      - mongo_data:/data/db
    restart: always
    networks:
      - zyrax_net

  redis:
    image: redis:7-alpine
    container_name: zyrax_redis
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - zyrax_net

  # Note: Using host nginx for reverse proxy instead of Docker nginx
  # SSL certs managed by certbot on host at /etc/letsencrypt/live/zyrax.bipro.tech/

networks:
  zyrax_net:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
