<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ZyraX Dashboard{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-gray-900 text-white font-sans">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-gray-800 p-6 hidden md:block">
            <h1 class="text-2xl font-bold text-purple-500 mb-8">ZyraX Bot</h1>
            <nav class="space-y-4">
                <a href="/" class="block px-4 py-2 rounded hover:bg-gray-700">🏠 Home</a>
                <a href="/stats" class="block px-4 py-2 rounded hover:bg-gray-700">📊 Statistics</a>
                <a href="/premium" class="block px-4 py-2 rounded hover:bg-gray-700">💰 Premium</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-8 overflow-y-auto">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>

</html>
